<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snokis Arcade | Free Online Games</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #121214; color: #ffffff; }
        header { background-color: #1a1a1e; padding: 20px; text-align: center; border-bottom: 3px solid #ff4757; }
        h1 { margin: 0; color: #ff4757; text-transform: uppercase; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .game-card { background-color: #1e1e24; border-radius: 8px; overflow: hidden; text-decoration: none; color: white; text-align: center; border: 1px solid #2e2e38; display: block;}
        .game-thumb { width: 100%; height: 140px; object-fit: cover; }
        .game-title { padding: 12px; font-weight: bold; margin: 0; }
    </style>
</head>
<body>
    <header><h1>🕹️ Snokis Arcade</h1></header>
    <div class="container">
        <div class="game-grid">
            <!-- Slope Game -->
            <a href="game-player.html?game=https://mathandpush.com" class="game-card">
                <img src="https://crazygames.com" class="game-thumb">
                <p class="game-title">Slope</p>
            </a>
            <!-- Retro Bowl Game -->
            <a href="game-player.html?game=https://github.io" class="game-card">
                <img src="https://crazygames.com" class="game-thumb">
                <p class="game-title">Retro Bowl</p>
            </a>
        </div>
    </div>
</body>
</html>
