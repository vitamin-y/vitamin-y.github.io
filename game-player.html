<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Arcade Game | Snokis Arcade</title>
    <style>
        body { margin: 0; background-color: #121214; font-family: sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        header { width: 100%; background-color: #1a1a1e; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-bottom: 3px solid #ff4757; }
        .back-btn { color: #fff; text-decoration: none; background-color: #ff4757; padding: 8px 16px; border-radius: 5px; font-weight: bold; }
        .game-container { flex-grow: 1; width: 90%; max-width: 1000px; margin: 20px 0; background-color: #000; border-radius: 8px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn">⬅️ Back to Arcade</a>
        <h2 style="margin:0; color:#ff4757;">Snokis Arcade Player</h2>
        <div style="width: 100px;"></div>
    </header>
    <div class="game-container">
        <iframe id="arcade-frame" src="" allowfullscreen></iframe>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('game');
        if (gameUrl) { document.getElementById('arcade-frame').src = gameUrl; }
    </script>
</body>
</html>
